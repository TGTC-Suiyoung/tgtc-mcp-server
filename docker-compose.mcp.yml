# tgtc-mcp-server hosted 远程版 —— 完整可独立运行的 compose 文件
#
# 要点：
#  · 端口只绑 127.0.0.1 —— 公网流量走 nginx 反代（见 nginx.mcp.conf）
#  · mem_limit 200m —— 弹性内存上限
#  · TGTC_API_KEY 启动时通过环境变量传入（Bearer 门禁 + 转发扣次凭证）
#
# 用法：TGTC_API_KEY=sk_live_xxx docker compose -f docker-compose.mcp.yml up -d --build

services:
  mcp:
    image: tgtc-mcp-server:0.1.8
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgtc_mcp
    environment:
      - TGTC_API_KEY=${TGTC_API_KEY}
    ports:
      - "127.0.0.1:8765:8765"
    mem_limit: 200m
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
