# ============================================================
# nginx 反代片段 —— 接入你现有 server 块
# hosted MCP 走 https://你的域名/mcp
#
# 【可选加固】限流：
#   1. 在 nginx 主配置（/www/server/nginx/conf/nginx.conf）的 http 块加一行：
#        limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;
#   2. 下面 /mcp location 已带 limit_req —— 每 IP 每秒 10 次，突发 20 内排队
# ============================================================

    # tgtc-mcp-server hosted（streamable-http）
    location /mcp {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        # 关键：mcp 2.x 校验 Host 必须等于容器地址——固定它，不能透传 $host（会 Invalid Host header）
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Bearer 鉴权头必须透传给上游（MCP server 校验）
        proxy_set_header Authorization $http_authorization;
        # streamable-http 是 SSE 流 —— 必须关缓冲、加长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        # 限流（需先在 http 块定义 mcp_limit zone，见文件头注释）
        limit_req zone=mcp_limit burst=20 nodelay;
    }
